      "on-activate": "  # fuzzylite_devtools provides nox, clang-format, gcovr, ruff, etc. (tools/dev/pyproject.toml)\n  venv=\"$FLOX_ENV_PROJECT/.local/.venv\"\n  if [ ! -d \"$venv\" ]; then\n    uv venv --python \"$FLOX_ENV/bin/python3\" \"$venv\" >&2 &&\n      uv pip install --quiet --python \"$venv/bin/python\" -e \"$FLOX_ENV_PROJECT/tools/dev\" >&2\n  fi\n"
    },
    "profile": {
      "common": "  [ -f \"$FLOX_ENV_PROJECT/.local/.venv/bin/activate\" ] && . \"$FLOX_ENV_PROJECT/.local/.venv/bin/activate\"\n"
